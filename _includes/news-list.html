<div class="news-list">
{% for post in include.posts %}
  <div class="news-item">
    <time class="news-date" datetime="{{ post.date | date: '%Y-%m-%d' }}">{{ post.date | date: "%Y-%m-%d" }}</time>
    <a class="news-title" href="{{ post.url | relative_url }}">{{ post.title | escape }}</a>
  </div>
{% endfor %}
</div>
