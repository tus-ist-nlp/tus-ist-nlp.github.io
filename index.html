---
layout: null
permalink: /
---
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Redirecting...</title>
    <link rel="alternate" hreflang="en" href="{{ '/en/' | absolute_url }}">
    <link rel="alternate" hreflang="ja" href="{{ '/ja/' | absolute_url }}">
    <link rel="alternate" hreflang="x-default" href="{{ '/' | absolute_url }}">
    <script>
      (function () {
        var languages = (navigator.languages && navigator.languages.length)
          ? navigator.languages
          : [navigator.language || ""];

        var prefersJapanese = languages.some(function (lang) {
          return /^ja(?:-|$)/i.test(String(lang));
        });

        var target = prefersJapanese
          ? "{{ '/ja/' | relative_url }}"
          : "{{ '/en/' | relative_url }}";

        window.location.replace(target);
      })();
    </script>
  </head>
  <body>
    <p>
      Redirecting...
      <a href="{{ '/en/' | relative_url }}">English</a>
      /
      <a href="{{ '/ja/' | relative_url }}">日本語</a>
    </p>
  </body>
</html>
